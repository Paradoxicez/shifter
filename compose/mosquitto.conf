# Bundled-mode Mosquitto configuration.
#
# Per CONTEXT.md `<specifics>` and the bundled compose-flavor threat model
# (T-20-03), Mosquitto MUST NOT be reachable from outside the compose
# network. The `bundled.yml` service definition deliberately omits any
# `ports:` mapping; this file restricts the broker to listen on the
# internal Docker bridge address only and tolerates anonymous publish
# from ChirpStack + the Shifter MQTT subscriber (Plan 13).
#
# External-mode customers (Plan 21) run their own broker; we do not
# bundle Mosquitto in that flavor.

persistence true
persistence_location /mosquitto/data/

log_dest stdout

listener 1883 0.0.0.0
allow_anonymous true
