root = "."
tmp_dir = "tmp"
[build]
cmd = "go build -o ./tmp/shifter ./cmd/shifter"
bin = "tmp/shifter serve"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor", "web", "node_modules", ".planning", "secrets"]
delay = 500
[log]
time = false
[misc]
clean_on_exit = true
